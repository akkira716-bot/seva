    // Compute Care Day from birthDate
    function computeCareDay(birthDateStr) {
      const birth = new Date(birthDateStr);
      const now = new Date();
      birth.setHours(0,0,0,0);
      now.setHours(0,0,0,0);
      const diffMs = now.getTime() - birth.getTime();
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const currentDay = Math.max(1, diffDays + 1);
      const totalDays = 42;
      return {
        currentDay: Math.min(currentDay, totalDays),
        totalDays,
        daysRemaining: Math.max(0, totalDays - currentDay),
        progressPercent: Math.min(100, Math.round((currentDay / totalDays) * 100))
      };
    }

                <span className="text-emerald-400 font-bold">● Standalone GitHub Pages Engine (Zero Tunnels Required)</span>

    // --- FEATURE 1: MAATRUAI GUIDANCE TAB ---

      const [aiQuery, setAiQuery] = useState('');

      const handleAskAI = (q) => {
        const query = q || aiQuery;
        if (!query.trim()) return;
        setAiResponse(`Analyzing Day ${careDay.currentDay} clinical guidelines...`);
        setTimeout(() => {
          if (query.toLowerCase().includes('latch') || query.toLowerCase().includes('breast')) {
            setAiResponse(`Advice for Day ${careDay.currentDay}: Ensure asymmetric latch where baby takes more of lower areola. Chin should indent breast firmly. If nipples are tender, express colostrum/milk onto nipples and air dry. Seek lactation support if pain persists past initial 30 seconds of suckling.`);
          } else if (query.toLowerCase().includes('bleed') || query.toLowerCase().includes('lochia')) {
            setAiResponse(`Advice for Day ${careDay.currentDay}: Lochia should be transitioning from bright red (rubra) to pinkish-brown (serosa). Soaking more than 1 maxi-pad per hour or passing clots larger than a golf ball is an emergency requiring immediate triage.`);
          } else {
            setAiResponse(`Guidance for Day ${careDay.currentDay}: Maintain 2.5-3L water intake, continue iron/calcium supplements, rest while baby sleeps, and monitor for fever ≥100.4°F. Contact your primary doctor or ASHA worker for clinical evaluations.`);
          }
        }, 500);
      };

      return (
        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
          <div className="flex items-center justify-between border-b pb-4">
            <div>

            <div className="p-4 rounded-2xl bg-teal-50 border border-teal-100 space-y-2">

    // --- FEATURE 2: FAMILY CARE TAB ---
    function FamilyCareTab({ record }) {
      const [tasks, setTasks] = useState([
        { id: 't1', title: 'Prepare Warm Iron-Rich Moong Dal Khichdi', role: 'Partner', category: 'Nutrition', priority: 'High', completed: true },
        { id: 't2', title: 'Infant Sunning / Kangaroo Mother Care (30 mins)', role: 'Mother/MIL', category: 'Newborn', priority: 'Normal', completed: false },
        { id: 't3', title: 'Verify Evening Calcium & Iron Supplements', role: 'Partner', category: 'Clinical', priority: 'High', completed: false },
        { id: 't4', title: 'Protect 2-Hour Afternoon Sleep Window for Mother', role: 'Sibling', category: 'Rest', priority: 'Normal', completed: true }
      ]);
      const [newTaskTitle, setNewTaskTitle] = useState('');
      const [newTaskRole, setNewTaskRole] = useState('Partner');

      const toggleTask = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const addTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        setTasks([...tasks, {
          id: `t-${Date.now()}`,
          title: newTaskTitle,
          role: newTaskRole,
          category: 'Family Care',
          priority: 'Normal',
          completed: false
        }]);
        setNewTaskTitle('');
      };

      const completedCount = tasks.filter(t => t.completed).length;

      return (
        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
          <div className="flex items-center justify-between border-b pb-4">
            <div>
              <h3 className="text-lg font-black text-slate-900">Family Care Mode: Shared Caregiver Tasks</h3>
              <p className="text-xs text-slate-500">Empower partners, mothers-in-law, and family to take active ownership of maternal recovery.</p>
            </div>
            <span className="text-xs font-extrabold px-3 py-1 rounded-full bg-rose-50 text-rose-700">
              {completedCount} of {tasks.length} Done ({Math.round((completedCount/tasks.length)*100)}%)
            </span>
          </div>

          <form onSubmit={addTask} className="flex gap-2 text-xs">
            <input
              type="text"
              placeholder="Assign a task (e.g. Prepare warm cumin water, clean baby clothes...)"
              value={newTaskTitle}
              onChange={e => setNewTaskTitle(e.target.value)}
              className="flex-1 px-3 py-2 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-rose-500"
            />
            <select
              value={newTaskRole}
              onChange={e => setNewTaskRole(e.target.value)}
              className="px-3 py-2 rounded-xl border border-slate-200 outline-none"
            >
              <option value="Partner">Partner</option>
              <option value="Mother/MIL">Mother/MIL</option>
              <option value="Sibling">Sibling</option>
              <option value="ASHA Worker">ASHA</option>
            </select>
            <button type="submit" className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold transition shadow-sm">
              Add Task
            </button>
          </form>

          <div className="divide-y divide-slate-100 text-xs">
            {tasks.map(t => (
              <div key={t.id} className="py-3 flex items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <input
                    type="checkbox"
                    checked={t.completed}
                    onChange={() => toggleTask(t.id)}
                    className="w-4 h-4 rounded text-rose-600 cursor-pointer"
                  />
                  <div>
                    <p className={`font-bold ${t.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>{t.title}</p>
                    <p className="text-[10px] text-slate-400">Assigned to: <strong className="text-slate-600">{t.role}</strong> • Category: {t.category}</p>
                  </div>
                </div>
                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                  t.priority === 'High' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600'
                }`}>{t.priority}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }
