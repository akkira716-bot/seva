    const LanguageContext = React.createContext({

    // Compute Care Day from birthDate
    function computeCareDay(birthDateStr) {
      const birth = new Date(birthDateStr);
      const now = new Date();
      birth.setHours(0,0,0,0);
      now.setHours(0,0,0,0);
      const diffMs = now.getTime() - birth.getTime();
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const currentDay = Math.max(1, diffDays + 1);
      const totalDays = 42;
      return {
        currentDay: Math.min(currentDay, totalDays),
        totalDays,
        daysRemaining: Math.max(0, totalDays - currentDay),
        progressPercent: Math.min(100, Math.round((currentDay / totalDays) * 100))
      };
    }

    // --- FEATURE 1: MAATRUAI GUIDANCE TAB ---
    function MaatruAIGuidanceTab({ careDay, record }) {
      const { t } = useLang();
      const [aiQuery, setAiQuery] = useState('');
      const [aiResponse, setAiResponse] = useState('');

      const handleAskAI = (q) => {
        const query = q || aiQuery;
        if (!query.trim()) return;
        setAiResponse(`Analyzing Day ${careDay.currentDay} clinical guidelines...`);
        setTimeout(() => {
          if (query.toLowerCase().includes('latch') || query.toLowerCase().includes('breast')) {
            setAiResponse(`Advice for Day ${careDay.currentDay}: Ensure asymmetric latch where baby takes more of lower areola. Chin should indent breast firmly. If nipples are tender, express colostrum/milk onto nipples and air dry. Seek lactation support if pain persists past initial 30 seconds of suckling.`);
          } else if (query.toLowerCase().includes('bleed') || query.toLowerCase().includes('lochia')) {
            setAiResponse(`Advice for Day ${careDay.currentDay}: Lochia should be transitioning from bright red (rubra) to pinkish-brown (serosa). Soaking more than 1 maxi-pad per hour or passing clots larger than a golf ball is an emergency requiring immediate triage.`);
          } else {
            setAiResponse(`Guidance for Day ${careDay.currentDay}: Maintain 2.5-3L water intake, continue iron/calcium supplements, rest while baby sleeps, and monitor for fever ≥100.4°F. Contact your primary doctor or ASHA worker for clinical evaluations.`);
          }
        }, 500);
      };

      return (
        <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
          <div className="flex items-center justify-between border-b pb-4">
            <div>
              <h3 className="text-lg font-black text-slate-900">{t('ai_title', 'MaatruAI: Personalized Daily Clinical Guidance')}</h3>
              <p className="text-xs text-slate-500">Day {careDay.currentDay} of 42 Postnatal Care Continuum • Non-diagnostic Evidence-based Guidance</p>
